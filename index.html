<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Per la mia futura dottoressa</title>
  <style>
    :root {
      --bg-color: #f2f2f7;
      --card-bg: #ffffff;
      --text-main: #1c1c1e;
      --text-secondary: #8e8e93;
      --accent: #FF3B30;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { min-height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      padding-top: max(24px, env(safe-area-inset-top));
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 28px;
      padding: 40px 24px;
      text-align: center;
      box-shadow: 0 16px 40px rgba(255, 59, 48, 0.08), 0 4px 12px rgba(0,0,0,0.04);
      position: relative;
      min-height: 340px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
    }

    /* --- ECG E CUORE --- */
    .header-ecg {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin-bottom: 24px;
      height: 40px;
      flex-shrink: 0;
    }

    .ecg-svg { flex: 1; height: 100%; max-width: 100px; }

    .ecg-line {
      fill: none;
      stroke: var(--accent);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 150;
      stroke-dashoffset: 150;
    }

    .ecg-left { animation: drawLeft 2.4s infinite linear; }
    @keyframes drawLeft {
      0% { stroke-dashoffset: 150; opacity: 0; }
      5% { opacity: 1; }
      25% { stroke-dashoffset: 0; opacity: 1; }
      30% { stroke-dashoffset: 0; opacity: 0; }
      100% { stroke-dashoffset: 0; opacity: 0; }
    }

    .heart-icon {
      width: 32px;
      height: 32px;
      fill: var(--accent);
      margin: 0 12px;
      animation: beatSync 2.4s infinite linear;
      filter: drop-shadow(0 4px 8px rgba(255, 59, 48, 0.4));
    }
    @keyframes beatSync {
      0%, 24% { transform: scale(1); }
      26% { transform: scale(1.25); }
      32% { transform: scale(1); }
      38% { transform: scale(1.25); }
      44%, 100% { transform: scale(1); }
    }

    .ecg-right { animation: drawRight 2.4s infinite linear; }
    @keyframes drawRight {
      0%, 40% { stroke-dashoffset: 150; opacity: 0; }
      42% { opacity: 1; stroke-dashoffset: 150; }
      62% { stroke-dashoffset: 0; opacity: 1; }
      67% { stroke-dashoffset: 0; opacity: 0; }
      100% { stroke-dashoffset: 0; opacity: 0; }
    }

    /* Rispetta chi ha disattivato le animazioni nel sistema */
    @media (prefers-reduced-motion: reduce) {
      .ecg-line { animation: none; stroke-dashoffset: 0; }
      .heart-icon { animation: none; }
    }

    #quote-text {
      font-size: 1.15rem;
      font-weight: 500;
      line-height: 1.45;
      margin-bottom: 16px;
      color: var(--text-main);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    #quote-author {
      font-size: 0.95rem;
      color: var(--text-secondary);
      font-style: italic;
      font-weight: 400;
      transition: opacity 0.4s ease;
    }

    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 22px;
      padding: 16px 24px;
      font-size: 1.05rem;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(255, 59, 48, 0.25);
      transition: transform 0.15s ease, background 0.3s, box-shadow 0.3s;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:active {
      transform: scale(0.96);
      background: #d32f2f;
      box-shadow: 0 4px 10px rgba(255, 59, 48, 0.2);
    }

    .fade-out { opacity: 0 !important; transform: translateY(5px); }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <div class="header-ecg" aria-hidden="true">
        <svg class="ecg-svg" viewBox="0 0 100 40">
          <polyline class="ecg-line ecg-left" points="0,20 20,20 25,16 30,20 35,20 37,22 42,4 47,32 50,20 60,20 65,14 75,20 100,20" />
        </svg>
        <svg class="heart-icon" viewBox="0 0 24 24">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
        <svg class="ecg-svg" viewBox="0 0 100 40">
          <polyline class="ecg-line ecg-right" points="0,20 15,20 20,16 25,20 30,20 32,22 37,4 42,32 45,20 55,20 60,14 70,20 100,20" />
        </svg>
      </div>

      <p id="quote-text" aria-live="polite">Sincronizzazione in corso...</p>
      <p id="quote-author"></p>
    </div>

    <button id="next-btn" class="btn">Un altro battito</button>
  </div>

  <script>
    const quotes = [
      // --- Le tue frasi originali ---
      { text: "Un grande chirurgo non ha solo mani ferme, ma un cuore immenso.", author: "Medicina" },
      { text: "Studia fino a quando l’anatomia del cuore non avrà più segreti per te. Sei nata per questo.", author: "Motivazione" },
      { text: "Ogni pagina che studi oggi è un battito in più che salverai domani.", author: "Il tuo percorso" },
      { text: "Fai un bel respiro, dottoressa. Non c’è ostacolo che tu non possa superare. Credo in te. – Dada", author: "Per te" },
      { text: "La medicina cura l’uomo. Ma l’amore e la dedizione lo fanno vivere.", author: "Ispirazione" },
      { text: "Non permettere a un esame difficile di farti dimenticare il chirurgo straordinario che diventerai.", author: "Studio" },
      { text: "Il successo non è definitivo, il fallimento non è fatale: ciò che conta è il coraggio di andare avanti.", author: "Attribuita a Winston Churchill" },

      // --- Nuove citazioni ---
      { text: "Ovunque l’arte della medicina sia amata, c’è anche un amore per l’umanità.", author: "Ippocrate" },
      { text: "La medicina è una scienza dell’incertezza e un’arte della probabilità.", author: "William Osler" },
      { text: "Il cuore ha le sue ragioni che la ragione non conosce.", author: "Blaise Pascal" },
      { text: "La cura più grande per l’uomo è un altro essere umano.", author: "Patch Adams" },
      { text: "Il buon medico cura la malattia; il grande medico cura la persona che ha la malattia.", author: "William Osler" },
      { text: "Solo i cuori coraggiosi sanno riconoscere il battito del cambiamento.", author: "Rita Levi-Montalcini" },
      { text: "La vita è breve, l’arte è lunga, l’occasione fugace, l’esperimento fallace, il giudizio difficile.", author: "Ippocrate" },
      { text: "Non smettere mai di imparare, perché la vita non smette mai di insegnare.", author: "Lin Yutang" },
      { text: "Un medico non deve mai perdere la capacità di meravigliarsi davanti alla vita che resiste.", author: "Paul Kalanithi" },
      { text: "Il ritmo del cuore non mente mai: insegna che dopo ogni contrazione c’è sempre un momento per respirare.", author: "Proverbio medico" },
      { text: "Ciò che facciamo solo per noi stessi muore con noi; ciò che facciamo per gli altri e per il mondo resta ed è immortale.", author: "Albert Pike" },
      { text: "Ascolta il paziente: ti sta dicendo la diagnosi.", author: "William Osler" },
      { text: "La scienza e la medicina non sono una professione, sono una forma di dedizione quotidiana.", author: "Umberto Veronesi" },
      { text: "C’è un solo tipo di successo: essere in grado di fare della propria vita ciò che si desidera.", author: "Christopher Morley" },
      { text: "Il cuore è il primo organo a formarsi e l’ultimo a smettere di battere: prendersene cura significa custodire l’essenza stessa della vita.", author: "Anonimo" },
      { text: "Le grandi cose sono fatte da una serie di piccole cose messe insieme.", author: "Vincent van Gogh" },
      { text: "La medicina è un cammino di fatica silenziosa che si trasforma in speranza per chi non ne ha più.", author: "Albert Schweitzer" },
      { text: "Chiunque può arrendersi, è la cosa più facile del mondo. Ma tenere duro quando tutti gli altri capirebbero se cedessi, questa è la vera forza.", author: "Anonimo" },
      { text: "Non consultare le tue paure, ma le tue speranze e i tuoi sogni.", author: "Papa Giovanni XXIII" },
      { text: "La professione medica è una vocazione, non un mestiere: richiede cervello, cuore e mani ferme.", author: "Christiaan Barnard" },
      { text: "Riparare un cuore non è solo una questione di bisturi o farmaci, è un patto silenzioso con la vita altrui.", author: "Anonimo" },
      { text: "Non arrenderti mai, perché quando pensi che sia finita, è proprio allora che tutto comincia.", author: "Anonimo" },
      { text: "In mezzo alla difficoltà risiede l’opportunità.", author: "Attribuita a Albert Einstein" },
      { text: "La fiducia in se stessi è il primo segreto del successo.", author: "Ralph Waldo Emerson" },
      { text: "L’obiettivo del medico è guarire a volte, alleviare spesso, confortare sempre.", author: "Ambroise Paré" },
      { text: "Il futuro appartiene a coloro che credono nella bellezza dei propri sogni.", author: "Eleanor Roosevelt" },
      { text: "La fatica di oggi sui libri è il respiro che restituirai a qualcuno domani.", author: "Anonimo" },
      { text: "Un cuore generoso e una mente rigorosa: è questa la vera armatura del medico.", author: "Rudolf Virchow" },
      { text: "Ciò che la mente non conosce, gli occhi non vedono.", author: "William Osler" },
      { text: "La perseveranza è il duro lavoro che fai dopo che ti sei stancato di fare il duro lavoro che hai già fatto.", author: "Newt Gingrich" },
      { text: "Chi salva una vita, salva il mondo intero.", author: "Talmud" },
      { text: "Nulla nella vita va temuto, dev’essere solo compreso. Ora è il tempo di comprendere di più, per temere di meno.", author: "Marie Curie" },
      { text: "Il battito cardiaco è la sinfonia più perfetta che la natura abbia mai composto.", author: "Anonimo" },
      { text: "L’eccellenza non è un atto, ma un’abitudine.", author: "Will Durant" },
      { text: "Dietro ogni esame superato c’è un paziente che riceverà cure migliori.", author: "Anonimo" },
      { text: "La passione per ciò che fai è la scintilla che accende ogni notte insonne sui libri.", author: "Anonimo" },
      { text: "Non giudicare ogni giorno dal raccolto che ottieni, ma dai semi che pianti.", author: "Robert Louis Stevenson" },
      { text: "Un chirurgo deve avere l’occhio di un falco, il cuore di un leone e la mano di una donna.", author: "Antico aforisma chirurgico" },
      { text: "La medicina richiede che non si dimentichi mai la persona dietro la diagnosi.", author: "Oliver Sacks" },
      { text: "Il segreto per andare avanti è iniziare.", author: "Attribuita a Mark Twain" },
      { text: "Abbi cura del tuo entusiasmo: sarà il carburante migliore nei momenti più duri.", author: "Anonimo" },
      { text: "La cura è un’arte: richiede una devozione totale e un’attenzione instancabile.", author: "Florence Nightingale" },
      { text: "Non è perché le cose sono difficili che non osiamo, è perché non osiamo che sono difficili.", author: "Seneca" },
      { text: "Ogni battito che ausculterai racconterà una storia di resilienza: impara a leggerla.", author: "Anonimo" },
      { text: "Il successo non è la chiave della felicità. La felicità è la chiave del successo. Se ami ciò che fai, avrai successo.", author: "Albert Schweitzer" },
      { text: "Credi di potercela fare e sarai già a metà strada.", author: "Theodore Roosevelt" },
      { text: "Il cammino della medicina è lungo e ripido, ma la vista dall’alto ripaga ogni singolo passo.", author: "Anonimo" },
      { text: "Il tuo tempo è limitato, quindi non sprecarlo vivendo la vita di qualcun altro.", author: "Steve Jobs" },
      { text: "Nel petto batte il motore della vita; capirne i segreti è uno dei privilegi più grandi concessi a un essere umano.", author: "Anonimo" },
      { text: "Non temere i momenti di stanchezza: ricordano solo quanto valore ha il traguardo che stai costruendo.", author: "Anonimo" }
    ];

    const quoteText = document.getElementById("quote-text");
    const quoteAuthor = document.getElementById("quote-author");
    const btn = document.getElementById("next-btn");

    // "Sacchetto" mescolato: nessuna frase si ripete finché non sono uscite tutte
    let bag = [];
    let lastIndex = -1;

    function refillBag() {
      bag = quotes.map((_, i) => i);
      for (let i = bag.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [bag[i], bag[j]] = [bag[j], bag[i]];
      }
      // evita che la prima del nuovo giro coincida con l'ultima del precedente
      if (bag[bag.length - 1] === lastIndex && bag.length > 1) {
        [bag[0], bag[bag.length - 1]] = [bag[bag.length - 1], bag[0]];
      }
    }

    function showRandomQuote() {
      if (bag.length === 0) refillBag();
      const index = bag.pop();
      lastIndex = index;
      const q = quotes[index];

      quoteText.classList.add("fade-out");
      quoteAuthor.classList.add("fade-out");

      setTimeout(() => {
        quoteText.textContent = `“${q.text}”`;
        quoteAuthor.textContent = q.author ? `— ${q.author}` : "";
        quoteText.classList.remove("fade-out");
        quoteAuthor.classList.remove("fade-out");
      }, 400);
    }

    window.addEventListener("load", showRandomQuote);

    btn.addEventListener("click", () => {
      if (navigator.vibrate) navigator.vibrate([30, 50, 30]);
      showRandomQuote();
    });
  </script>

</body>
</html>
