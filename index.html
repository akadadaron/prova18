<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Per la mia futura dottoressa</title>
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #1c1c1e;
      --text-main: #ffffff;
      --text-secondary: #8e8e93;
      --accent: #ff3b30; /* Rosso iOS */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
      overflow: hidden; /* Evita lo scroll elastico */
    }

    .container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    /* Stile della Card */
    .card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 40px 24px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(255, 59, 48, 0.05);
      position: relative;
      min-height: 250px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* Icona del cuore con animazione battito */
    .heart-icon {
      width: 32px;
      height: 32px;
      fill: var(--accent);
      margin-bottom: 24px;
      animation: heartbeat 2s infinite;
    }

    @keyframes heartbeat {
      0% { transform: scale(1); }
      15% { transform: scale(1.15); }
      30% { transform: scale(1); }
      45% { transform: scale(1.15); }
      60% { transform: scale(1); }
    }

    /* Testo delle frasi */
    #quote-text {
      font-size: 1.3rem;
      font-weight: 500;
      line-height: 1.4;
      margin-bottom: 16px;
      transition: opacity 0.4s ease;
    }

    #quote-author {
      font-size: 0.9rem;
      color: var(--text-secondary);
      font-style: italic;
      transition: opacity 0.4s ease;
    }

    /* Pulsante stile iOS */
    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 20px;
      padding: 16px 24px;
      font-size: 1.05rem;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.3s;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:active {
      transform: scale(0.96);
      background: #d32f2f;
    }

    /* Classe per l'animazione di sfumatura durante il cambio frase */
    .fade-out { opacity: 0 !important; }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <svg class="heart-icon" viewBox="0 0 24 24">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
      </svg>
      <p id="quote-text">Caricamento...</p>
      <p id="quote-author"></p>
    </div>

    <button id="next-btn" class="btn">Mostra un'altra frase</button>
  </div>

  <script>
    // Array contenente tutte le tue frasi. Puoi aggiungerne quante ne vuoi.
    const quotes = [
      { text: "Un grande chirurgo non ha solo mani ferme, ma un cuore grande.", author: "Anonimo" },
      { text: "Studia fino a quando l'anatomia del cuore non avrà più segreti per te. Sei nata per questo.", author: "Motivazione Studio" },
      { text: "Ogni pagina che studi oggi è un battito in più che salverai domani.", author: "Medicina" },
      { text: "Fai un bel respiro, dottoressa. Non c'è ostacolo che tu non possa superare. Credo in te. – Dada", author: "Per te" },
      { text: "La medicina cura l'uomo, la medicina preventiva lo salva. Ma l'amore lo fa vivere.", author: "Anonimo" },
      { text: "Il cuore ha le sue ragioni che la ragione non conosce.", author: "Blaise Pascal" },
      { text: "Non permettere a un esame difficile di farti dimenticare il chirurgo straordinario che diventerai.", author: "Motivazione" },
      { text: "Il successo non è definitivo, il fallimento non è fatale: ciò che conta è il coraggio di andare avanti.", author: "Winston Churchill" }
    ];

    const quoteText = document.getElementById("quote-text");
    const quoteAuthor = document.getElementById("quote-author");
    const btn = document.getElementById("next-btn");
    
    let currentIndex = -1;

    // Funzione per mostrare una frase casuale (diversa dalla precedente)
    function showRandomQuote() {
      let newIndex;
      do {
        newIndex = Math.floor(Math.random() * quotes.length);
      } while (newIndex === currentIndex && quotes.length > 1);
      
      currentIndex = newIndex;

      // Effetto di transizione visiva (fade out)
      quoteText.classList.add("fade-out");
      quoteAuthor.classList.add("fade-out");

      setTimeout(() => {
        // Cambia il testo mentre è invisibile
        quoteText.innerText = `"${quotes[currentIndex].text}"`;
        quoteAuthor.innerText = quotes[currentIndex].author ? `- ${quotes[currentIndex].author}` : "";
        
        // Riporta visibile (fade in)
        quoteText.classList.remove("fade-out");
        quoteAuthor.classList.remove("fade-out");
      }, 400); // 400ms corrispondono al tempo di transizione CSS
    }

    // Mostra la prima frase al caricamento della pagina
    window.onload = showRandomQuote;

    // Associa la funzione al click del pulsante
    btn.addEventListener("click", () => {
      // Vibrazione aptica per i dispositivi supportati (effetto nativo iOS)
      if (navigator.vibrate) navigator.vibrate(50);
      showRandomQuote();
    });
  </script>

</body>
</html>
