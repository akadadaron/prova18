<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Per la mia futura dottoressa</title>
  <style>
    :root {
      --bg-color: #f2f2f7;
      --card-bg: #ffffff;
      --text-main: #1c1c1e;
      --text-secondary: #8e8e93;
      --accent: #FF3B30;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    .container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 28px;
      padding: 40px 24px;
      text-align: center;
      box-shadow: 0 16px 40px rgba(255, 59, 48, 0.08), 0 4px 12px rgba(0,0,0,0.04);
      position: relative;
      min-height: 280px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
    }

    /* --- INIZIO SEZIONE ECG E CUORE --- */
    .header-ecg {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin-bottom: 24px;
      height: 40px;
    }

    .ecg-svg {
      flex: 1;
      height: 100%;
      max-width: 100px;
    }

    .ecg-line {
      fill: none;
      stroke: var(--accent);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 150;
      stroke-dashoffset: 150;
    }

    /* Animazione segnale in entrata (da sinistra) */
    .ecg-left {
      animation: drawLeft 3s infinite ease-out;
    }
    @keyframes drawLeft {
      0% { stroke-dashoffset: 150; opacity: 0; }
      5% { opacity: 1; }
      20% { stroke-dashoffset: 0; opacity: 1; }
      /* Mantiene la linea visibile per lunghissimo tempo */
      85% { stroke-dashoffset: 0; opacity: 1; } 
      95% { stroke-dashoffset: 0; opacity: 0; }
      100% { stroke-dashoffset: 150; opacity: 0; }
    }

    /* Cuore al centro con doppio battito sincronizzato */
    .heart-icon {
      width: 32px;
      height: 32px;
      fill: var(--accent);
      margin: 0 12px;
      animation: beatSync 3s infinite;
      filter: drop-shadow(0 4px 8px rgba(255, 59, 48, 0.4));
    }
    @keyframes beatSync {
      0%, 18% { transform: scale(1); }
      22% { transform: scale(1.25); }
      26% { transform: scale(1); }
      30% { transform: scale(1.25); }
      34%, 100% { transform: scale(1); }
    }

    /* Animazione segnale in uscita (verso destra) */
    .ecg-right {
      animation: drawRight 3s infinite ease-out;
    }
    @keyframes drawRight {
      0%, 28% { stroke-dashoffset: 150; opacity: 0; }
      30% { opacity: 1; }
      45% { stroke-dashoffset: 0; opacity: 1; }
      /* Rimane visibile insieme all'onda sinistra */
      85% { stroke-dashoffset: 0; opacity: 1; }
      95% { stroke-dashoffset: 0; opacity: 0; }
      100% { stroke-dashoffset: 150; opacity: 0; }
    }
    /* --- FINE SEZIONE ECG --- */

    /* Testi */
    #quote-text {
      font-size: 1.25rem;
      font-weight: 500;
      line-height: 1.45;
      margin-bottom: 16px;
      color: var(--text-main);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    #quote-author {
      font-size: 0.95rem;
      color: var(--text-secondary);
      font-style: italic;
      font-weight: 400;
      transition: opacity 0.4s ease;
    }

    /* Pulsante */
    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 22px;
      padding: 16px 24px;
      font-size: 1.05rem;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(255, 59, 48, 0.25);
      transition: transform 0.15s ease, background 0.3s, box-shadow 0.3s;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:active {
      transform: scale(0.96);
      background: #d32f2f;
      box-shadow: 0 4px 10px rgba(255, 59, 48, 0.2);
    }

    .fade-out { opacity: 0 !important; transform: translateY(5px); }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      
      <div class="header-ecg">
        <svg class="ecg-svg" viewBox="0 0 100 40">
          <polyline class="ecg-line ecg-left" points="0,20 20,20 25,16 30,20 35,20 37,22 42,4 47,32 50,20 60,20 65,14 75,20 100,20" />
        </svg>
        
        <svg class="heart-icon" viewBox="0 0 24 24">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>

        <svg class="ecg-svg" viewBox="0 0 100 40">
          <polyline class="ecg-line ecg-right" points="0,20 15,20 20,16 25,20 30,20 32,22 37,4 42,32 45,20 55,20 60,14 70,20 100,20" />
        </svg>
      </div>

      <p id="quote-text">Sincronizzazione in corso...</p>
      <p id="quote-author"></p>
    </div>

    <button id="next-btn" class="btn">Un altro battito</button>
  </div>

  <script>
    const quotes = [
      { text: "Un grande chirurgo non ha solo mani ferme, ma un cuore immenso.", author: "Dada" },
      { text: "Studia fino a quando l'anatomia del cuore non avrà più segreti per te. Sei nata per questo.", author: "Dada" },
      { text: "Ogni pagina che studi oggi è un battito in più che salverai domani.", author: "Dada" },
      { text: "Fai un bel respiro, dottoressa. Non c'è ostacolo che tu non possa superare. Credo in te.", author: "Dada" },
      { text: "La medicina cura l'uomo. Ma l'amore e la dedizione lo fanno vivere.", author: "Dada" },
      { text: "Non permettere a un esame difficile di farti dimenticare il chirurgo straordinario che diventerai.", author: "Dada" },
      { text: "Il successo non è definitivo, il fallimento non è fatale: ciò che conta è il coraggio di andare avanti.", author: "Winston Churchill" }
    ];

    const quoteText = document.getElementById("quote-text");
    const quoteAuthor = document.getElementById("quote-author");
    const btn = document.getElementById("next-btn");
    
    let currentIndex = -1;

    function showRandomQuote() {
      let newIndex;
      do {
        newIndex = Math.floor(Math.random() * quotes.length);
      } while (newIndex === currentIndex && quotes.length > 1);
      
      currentIndex = newIndex;

      quoteText.classList.add("fade-out");
      quoteAuthor.classList.add("fade-out");

      setTimeout(() => {
        quoteText.innerText = `"${quotes[currentIndex].text}"`;
        quoteAuthor.innerText = quotes[currentIndex].author ? `- ${quotes[currentIndex].author}` : "";
        
        quoteText.classList.remove("fade-out");
        quoteAuthor.classList.remove("fade-out");
      }, 400); 
    }

    window.onload = showRandomQuote;

    btn.addEventListener("click", () => {
      if (navigator.vibrate) navigator.vibrate([30, 50, 30]); 
      showRandomQuote();
    });
  </script>

</body>
</html>
